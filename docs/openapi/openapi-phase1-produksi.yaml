openapi: 3.1.0
info:
  title: "Lukla Operations Engine - API Contract (Tahap 1: Produksi)"
  version: 1.0.0
  description: |
    API Contract untuk **Tahap 1 (Produksi: Line & Terminal Input 30 Menit)** Lukla Operations Engine (Fasilitas Ciwidey).
    Berdasarkan dokumen alur kerja `urutan pengerjaan.txt` dan diagram proses `Lukla_BPMN_v2.drawio`:
    - **BPMN 04**: Alokasi Penjahit ke Line & Perpindahan Line (FR-7.1)
    - **BPMN 05**: Input Output 30 Menit Terminal Mandor & Assembly (FR-7.3, FR-7.4)
    - **Snapshot Tarif Borongan**: Snapshot `sewing_rate` saat output dicatat untuk fondasi payroll akurat (Tahap 2).
    - **Assembly & Status Menunggu QC**: Penggabungan komponen menjadi unit utuh siap inspeksi QC (Tahap 4).
    - **Dashboard Produksi Real-Time**: Monitoring target vs aktual per slot 30 menit untuk lantai produksi.

  contact:
    name: Lukla Engineering Team
    email: ops@lukla.co

servers:
  - url: http://localhost:8080/api/v1
    description: Local API Server (Port 8080)
  - url: /api/v1
    description: Relative API Root

security:
  - BearerAuth: []

tags:
  - name: Production Lines (BPMN 04)
    description: Manajemen line jahit lantai produksi pabrik (kapasitas hingga ±70 mesin)
  - name: Line Allocations (BPMN 04)
    description: Alokasi penjahit ke line/order dan perpindahan line (transfer) jika terjadi kendala mesin
  - name: Production Outputs (BPMN 05)
    description: Input output komponen per penjahit setiap interval 30 menit via terminal mandor terverifikasi
  - name: Assembly & QC Queue (BPMN 05)
    description: Pencatatan assembly gabungan komponen menjadi unit produk dengan status MENUNGGU_QC
  - name: Production Dashboard (BPMN 05)
    description: Pemantauan real-time progres output per line, per penjahit, dan per order

paths:
  # ==========================================
  # 1. PRODUCTION LINES (BPMN 04)
  # ==========================================
  /lines:
    get:
      tags:
        - Production Lines (BPMN 04)
      summary: Daftar line produksi
      description: |
        Mengambil seluruh line produksi di pabrik beserta kapasitas mesin, jumlah penjahit aktif, dan order yang sedang berjalan.
        - **Akses**: Staf Internal (Eksekutif, Kepala Produksi, Mandor, dsb).
      responses:
        '200':
          description: Daftar line produksi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionLine'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags:
        - Production Lines (BPMN 04)
      summary: Tambah line produksi baru
      description: |
        Menambahkan line produksi baru pada lantai kerja. Hanya Kepala Produksi dan Eksekutif yang berwenang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLineRequest'
      responses:
        '201':
          description: Line produksi berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductionLine'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /lines/{id}:
    get:
      tags:
        - Production Lines (BPMN 04)
      summary: Detail line produksi
      description: Mengambil data detail spesifik satu line produksi beserta alokasi penjahit saat ini.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail line produksi
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductionLineDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Production Lines (BPMN 04)
      summary: Perbarui data line produksi
      description: Memperbarui nama, supervisor/mandor penanggung jawab, kapasitas mesin, atau status line.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLineRequest'
      responses:
        '200':
          description: Line berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductionLine'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # 2. LINE ALLOCATIONS & TRANSFERS (BPMN 04)
  # ==========================================
  /line-allocations:
    get:
      tags:
        - Line Allocations (BPMN 04)
      summary: Daftar alokasi penjahit ke line
      description: |
        Menampilkan daftar alokasi operator penjahit aktif maupun riwayat penugasan ke line dan order produksi.
      parameters:
        - name: line_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, TRANSFERRED]
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal penugasan (YYYY-MM-DD)
      responses:
        '200':
          description: Daftar alokasi penjahit berhasil diambil
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LineAllocation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Line Allocations (BPMN 04)
      summary: Alokasikan penjahit ke line & order (BPMN 04)
      description: |
        Kepala Produksi / Mandor menugaskan penjahit ke line tertentu untuk mengerjakan SPK/Order.
        - Memvalidasi batas total mesin lantai produksi pabrik (maksimal ±70 mesin).
        - Operator harus berstatus aktif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAllocationRequest'
      responses:
        '201':
          description: Penjahit berhasil dialokasikan ke line
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LineAllocation'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Operator sudah memiliki alokasi aktif di line lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /line-allocations/{id}/transfer:
    post:
      tags:
        - Line Allocations (BPMN 04)
      summary: Pindahkan penjahit ke line lain (BPMN 04: Pindah Line)
      description: |
        Memindahkan penjahit ke line lain (misalnya karena kendala mesin rusak atau penyeimbangan line jahit).
        - Alokasi lama ditandai sebagai `TRANSFERRED`.
        - Alokasi baru dibuat di line tujuan dengan status `ACTIVE`.
        - Output berikutnya akan dicatat sesuai line baru secara otomatis.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID alokasi penjahit saat ini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOperatorRequest'
      responses:
        '200':
          description: Perpindahan line berhasil dicatat
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TransferResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /line-allocations/{id}/history:
    get:
      tags:
        - Line Allocations (BPMN 04)
      summary: Riwayat perpindahan line operator
      description: Mengambil seluruh rekam jejak perpindahan line operator penjahit tertentu.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Riwayat perpindahan line
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AllocationTransferLog'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # 3. PRODUCTION OUTPUTS (30-MINUTES) (BPMN 05)
  # ==========================================
  /production-outputs:
    get:
      tags:
        - Production Outputs (BPMN 05)
      summary: Daftar input output komponen jahit
      description: |
        Menampilkan daftar log output per interval 30 menit. Dapat difilter berdasarkan line, order, operator, dan tanggal.
      parameters:
        - name: line_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: component_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Format YYYY-MM-DD
        - name: time_slot
          in: query
          required: false
          schema:
            type: string
            example: "08:30-09:00"
      responses:
        '200':
          description: Daftar output komponen
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionOutput'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Production Outputs (BPMN 05)
      summary: Input output komponen 30 menit oleh mandor (BPMN 05)
      description: |
        Input jumlah pcs komponen selesai per penjahit via terminal mandor (touch interface).
        - **Aturan Bisnis (Keputusan Klien)**: Penjahit tidak menginput sendiri. Input mandor = terverifikasi.
        - **Snapshot Tarif Borongan**: Sistem otomatis mengambil snapshot `sewing_rate` yang berlaku pada Rate Card saat waktu input untuk perhitungan payroll mingguan di Tahap 2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutputRequest'
      responses:
        '201':
          description: Output 30 menit berhasil dicatat
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductionOutput'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /production-outputs/batch:
    post:
      tags:
        - Production Outputs (BPMN 05)
      summary: Batch input output 30 menit (Terminal Mandor Cepat)
      description: |
        Memungkinkan mandor memasukkan output beberapa penjahit dalam satu line sekaligus untuk slot 30 menit yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateOutputRequest'
      responses:
        '201':
          description: Seluruh output batch berhasil dicatat
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionOutput'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /production-outputs/{id}:
    get:
      tags:
        - Production Outputs (BPMN 05)
      summary: Detail catatan output 30 menit
      description: Mengambil detail satu record output komponen termasuk snapshot rate card dan identitas mandor penginput.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail output komponen
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductionOutput'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # 4. ASSEMBLY & QC QUEUE (BPMN 05)
  # ==========================================
  /assemblies:
    get:
      tags:
        - Assembly & QC Queue (BPMN 05)
      summary: Daftar perakitan (assembly) unit produk
      description: Menampilkan daftar riwayat penggabungan komponen menjadi unit utuh.
      parameters:
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: article_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar perakitan assembly
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssemblyRecord'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Assembly & QC Queue (BPMN 05)
      summary: Catat assembly produk utuh (Status Menunggu QC)
      description: |
        Menggabungkan komponen-komponen yang telah selesai dijahit dari beberapa penjahit menjadi unit produk utuh.
        - Memvalidasi kelengkapan akumulasi output komponen untuk order terkait.
        - Unit produk otomatis diberi status **`MENUNGGU_QC`** dan masuk ke antrean inspeksi QC (BPMN 06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssemblyRequest'
      responses:
        '201':
          description: Assembly berhasil dicatat dan masuk antrean QC
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AssemblyRecord'
        '400':
          description: Validasi komponen tidak mencukupi atau request tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /assemblies/queue-qc:
    get:
      tags:
        - Assembly & QC Queue (BPMN 05)
      summary: Antrean unit assembly siap diperiksa QC
      description: |
        Menampilkan batch produk hasil assembly yang berstatus `MENUNGGU_QC` dan menunggu giliran inspeksi oleh Quality Control.
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Antrean QC
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QCQueueItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==========================================
  # 5. REAL-TIME PRODUCTION DASHBOARD (BPMN 05)
  # ==========================================
  /production-dashboard/realtime:
    get:
      tags:
        - Production Dashboard (BPMN 05)
      summary: Dashboard produksi lantai pabrik real-time
      description: |
        Menyajikan metrik real-time untuk lantai pabrik:
        - Total mesin aktif vs kapasitas pabrik (maksimal ±70 mesin).
        - Output aktual vs target kumulatif hari ini.
        - Ringkasan performa per line jahit per interval 30 menit terkini.
      responses:
        '200':
          description: Data dashboard real-time
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RealtimeProductionMetrics'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /production-dashboard/lines/{line_id}:
    get:
      tags:
        - Production Dashboard (BPMN 05)
      summary: Detail tracking progres line produksi
      description: |
        Menampilkan rincian progres output per slot 30 menit (misal: 08:00, 08:30, 09:00 ...) untuk line tertentu beserta penjahit yang sedang aktif.
      parameters:
        - name: line_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal analisis (default hari ini)
      responses:
        '200':
          description: Progres line per slot 30 menit
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LineDailyProgress'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /production-dashboard/orders/{order_id}:
    get:
      tags:
        - Production Dashboard (BPMN 05)
      summary: Tracking progres komponen & assembly per SPK / Order
      description: |
        Menampilkan status penyelesaian tiap komponen dan perakitan produk untuk suatu Production Order.
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Progres SPK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/OrderProductionProgress'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan access token JWT dari endpoint login.

  responses:
    BadRequestError:
      description: Permintaan tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Parameter atau body request tidak valid.
    UnauthorizedError:
      description: Tidak terautentikasi (Bearer token tidak ada atau tidak valid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Header Authorization Bearer token diperlukan.
    ForbiddenError:
      description: Akses ditolak karena tidak memiliki wewenang role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Akses ditolak untuk role pengguna ini.
    NotFoundError:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Data yang diminta tidak ditemukan.
    ConflictError:
      description: Terjadi konflik data atau duplikasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: Terjadi konflik status atau kode data.

  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Deskripsi kegagalan permintaan
            details:
              type: string
              example: Detail error validasi atau penolakan

    ProductionLine:
      type: object
      required:
        - id
        - code
        - name
        - maxCapacity
        - activeOperatorsCount
        - status
      properties:
        id:
          type: string
          format: uuid
          example: 3d2f9b8c-1e2a-4b5c-9d8e-7f6a5b4c3d2e
        code:
          type: string
          example: LINE-01
        name:
          type: string
          example: Line Jahit Parka & Jaket Tebal
        maxCapacity:
          type: integer
          example: 24
          description: Kapasitas mesin pada line ini (bagian dari batas ±70 mesin pabrik)
        activeOperatorsCount:
          type: integer
          example: 18
          description: Jumlah penjahit yang aktif dialokasikan saat ini
        supervisorId:
          type: string
          format: uuid
          nullable: true
          example: e6447b6c-7ffc-462f-a0d6-a2ef6a387634
        supervisorName:
          type: string
          nullable: true
          example: Bambang Supriyadi (Mandor)
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE]
          example: ACTIVE
